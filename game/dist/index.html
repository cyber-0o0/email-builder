/* Layout: full-bleed canvas, HUD strips pinned top & bottom, modal panels centred.
   Identity: demolition site — hazard yellow on asphalt, chunky stencil type. */
:root {
  --hazard: #ffc83d;
  --hazard-dk: #c7901b;
  --asphalt: #1d1f25;
  --panel: #2a2d36;
  --panel-2: #353945;
  --ink: #121318;
  --cream: #fff6e0;
  --muted: #a9adba;
  --danger: #ff4d3d;
  --good: #4fd36a;
  --good-dk: #2b9a43;
  --ad: #8b5cf6;
  --ad-dk: #5b34b5;
  --display: "Russo One", "Arial Black", Impact, system-ui, sans-serif;
  --body: "Rubik", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--asphalt); color: var(--cream); font-family: var(--body);
  user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
#game { position: fixed; inset: 0; display: block; touch-action: none; cursor: crosshair; }
button { font-family: var(--display); color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
.top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0; }
.chip { pointer-events: auto; background: rgba(18,19,24,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 14px; padding: 7px 12px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
#lvlChip { display: flex; flex-direction: column; line-height: 1.05; min-width: 74px; }
#lvlChip b { font-family: var(--display); font-size: 18px; font-weight: 400; letter-spacing: .02em; }
#lvlChip small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#targetBox { flex: 1; min-width: 0; max-width: 520px; margin: 0 auto; text-align: center; }
#tName { font-family: var(--display); font-size: 16px; text-shadow: 0 2px 0 rgba(0,0,0,.6); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tName .boss { display: inline-block; font-size: 11px; padding: 2px 7px 1px; margin-right: 6px; border-radius: 4px; color: var(--ink); vertical-align: 2px;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 7px, var(--ink) 7px 14px); text-shadow: none; }
#tName .boss span { background: var(--hazard); padding: 0 4px; border-radius: 2px; }
.hp { position: relative; height: 22px; border-radius: 11px; background: rgba(18,19,24,.8); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.6), 0 0 0 2px rgba(0,0,0,.4); }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 11px; }
#hpGhost { background: #fff; opacity: .85; }
#hpFill { background: linear-gradient(180deg, #ff7a5c, var(--danger) 55%, #c42a1d); }
#hpFill::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); }
#hpText { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 13px; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.hp.hit { animation: hpHit .18s; }
@keyframes hpHit { 30% { transform: translate(2px, 1px) scale(1.02); } 60% { transform: translate(-2px, 0); } }
#coinChip { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 84px; justify-content: flex-end; }
.coin-ico { width: 22px; height: 22px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 35%, #fff1a0, #ffcf3a 45%, #c48a1c); box-shadow: 0 2px 0 #8a5d10, inset 0 0 0 2px rgba(255,255,255,.25); position: relative; }
.coin-ico::after { content: ""; position: absolute; left: 9.5px; top: 5px; width: 3px; height: 12px; background: #c48a1c; border-radius: 2px; }
#coinChip.bump { animation: bump .22s; }
@keyframes bump { 40% { transform: scale(1.15); } }
.icon-btn { pointer-events: auto; width: 42px; height: 42px; border-radius: 12px; background: rgba(18,19,24,.72); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.35); flex: none; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.icon-btn svg { width: 22px; height: 22px; fill: var(--cream); }

#combo { position: absolute; left: 14px; top: calc(78px + env(safe-area-inset-top, 0px)); font-family: var(--display); font-size: 22px; color: var(--hazard);
  text-shadow: 0 3px 0 rgba(0,0,0,.55); opacity: 0; transition: opacity .2s; transform-origin: left center; }
#combo.on { opacity: 1; }
#combo small { display: block; font-size: 12px; color: var(--cream); opacity: .8; }
#combo.pulse { animation: pulse .18s; }
@keyframes pulse { 40% { transform: scale(1.25) rotate(-3deg); } }

#toast { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; font-family: var(--display); pointer-events: none; opacity: 0; }
#toast.show { animation: toast 2.2s ease-out forwards; }
#toast small { display: block; font-size: 14px; letter-spacing: .2em; color: var(--hazard); text-transform: uppercase; }
#toast b { display: block; font-weight: 400; font-size: clamp(28px, 7vw, 54px); text-shadow: 0 4px 0 rgba(0,0,0,.5); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }

#hint { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); width: min(80vw, 340px); text-align: center; font-weight: 600; font-size: 16px;
  background: rgba(18,19,24,.8); padding: 12px 16px; border-radius: 16px; pointer-events: none; transition: opacity .3s; }
#hint .finger { font-size: 34px; display: block; animation: tap 1s infinite; }
@keyframes tap { 50% { transform: translateY(8px) scale(.92); } }

/* ---------- bottom bar ---------- */
.bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(18,19,24,0), rgba(18,19,24,.75) 30%); pointer-events: none; }
#btnShop { pointer-events: auto; position: relative; flex: none; width: 70px; height: 70px; border-radius: 18px; background: var(--hazard); color: var(--ink);
  box-shadow: 0 5px 0 var(--hazard-dk); display: grid; place-items: center; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; padding-top: 4px; }
#btnShop svg { width: 30px; height: 30px; fill: var(--ink); margin-bottom: -6px; }
#btnShop:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--hazard-dk); }
#btnShop .dot { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); border: 3px solid var(--asphalt); display: none; animation: dot 1s infinite; }
#btnShop.can .dot { display: block; }
@keyframes dot { 50% { transform: scale(1.2); } }
#items { pointer-events: auto; flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; overflow-y: visible; padding: 8px 4px 6px; scrollbar-width: none; touch-action: pan-x; }
#items::-webkit-scrollbar { display: none; }
.it { position: relative; flex: none; width: 66px; height: 66px; border-radius: 16px; background: var(--panel); box-shadow: 0 4px 0 #15171c; padding: 0;
  transition: transform .12s; --cd: 0; }
.it canvas { width: 54px; height: 54px; position: absolute; left: 6px; top: 6px; }
.it::after { content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
  background: conic-gradient(rgba(10,10,14,.72) calc(var(--cd) * 360deg), transparent 0); }
.it .lv { position: absolute; right: 4px; bottom: 3px; font-size: 10px; background: rgba(0,0,0,.55); padding: 1px 4px; border-radius: 5px; z-index: 1; }
.it .key { position: absolute; left: 5px; top: 3px; font-size: 10px; opacity: .55; z-index: 1; }
.it.sel { background: var(--panel-2); transform: translateY(-6px); box-shadow: 0 0 0 3px var(--hazard), 0 6px 0 #15171c; }
.it.ready { animation: ready .35s; }
@keyframes ready { 40% { transform: translateY(-6px) scale(1.12); box-shadow: 0 0 0 3px #fff, 0 0 18px #fff8; } }
.it.deny { animation: deny .3s; }
@keyframes deny { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.it.locked { background: #23252c; box-shadow: 0 4px 0 #15171c; cursor: default; }
.it.locked canvas { filter: brightness(0) opacity(.45); }
.it.locked .lv { left: 0; right: 0; bottom: 4px; text-align: center; background: none; color: var(--muted); font-size: 10px; }
.it.new::before { content: "NEW"; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); font-size: 9px; background: var(--danger); color: #fff; padding: 1px 5px; border-radius: 5px; z-index: 2; }

/* ---------- panels ---------- */
.screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(12,12,16,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 10; }
.screen[hidden] { display: none !important; }
.panel { width: min(440px, 100%); max-height: calc(100% - 10px); display: flex; flex-direction: column; background: var(--panel); border-radius: 22px; overflow: hidden;
  box-shadow: 0 10px 0 rgba(0,0,0,.35), 0 30px 60px rgba(0,0,0,.4); animation: panelIn .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes panelIn { from { transform: translateY(30px) scale(.9); opacity: 0; } }
.panel-head { position: relative; padding: 16px 18px 14px; background: var(--ink); text-align: center; }
.panel-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, var(--ink) 12px 24px); }
.panel-head h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .03em; }
.panel-body { padding: 16px; overflow-y: auto; touch-action: pan-y; }
.close { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 10px; background: var(--panel-2); font-size: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 54px; padding: 0 20px; border-radius: 16px; font-size: 18px;
  background: var(--good); color: #fff; box-shadow: 0 5px 0 var(--good-dk); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--good-dk); }
.btn.ad { background: var(--ad); box-shadow: 0 5px 0 var(--ad-dk); }
.btn.ad:active { box-shadow: 0 1px 0 var(--ad-dk); }
.btn.yellow { background: var(--hazard); color: var(--ink); text-shadow: none; box-shadow: 0 5px 0 var(--hazard-dk); }
.btn[disabled] { background: #474b57; box-shadow: 0 5px 0 #30333b; color: #8d91a0; cursor: default; text-shadow: none; }
.btn .play-ico { width: 0; height: 0; border-left: 14px solid currentColor; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.row-btns { display: flex; gap: 10px; }
.row-btns .btn { flex: 1; padding: 0 10px; }

/* title */
#title { background: radial-gradient(ellipse at 50% 40%, rgba(18,19,24,.2), rgba(18,19,24,.75)); }
.logo { text-align: center; font-family: var(--display); line-height: .9; transform: rotate(-4deg); margin-bottom: 26px; }
.logo span { display: block; font-size: clamp(54px, 15vw, 104px); color: var(--hazard); text-shadow: 0 6px 0 var(--hazard-dk), 0 12px 0 rgba(0,0,0,.35); letter-spacing: .02em; }
.logo span + span { color: var(--cream); text-shadow: 0 6px 0 #9b8e70, 0 12px 0 rgba(0,0,0,.35); margin-left: .5em; }
.logo em { display: block; font-style: normal; font-size: clamp(11px, 3vw, 15px); letter-spacing: .12em; max-width: 90vw; margin-inline: auto; line-height: 1.4; color: var(--cream); margin-top: 18px; transform: rotate(4deg); opacity: .85; }
.title-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.title-wrap .btn { height: 66px; font-size: 26px; padding: 0 44px; animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.06); } }
.title-meta { font-size: 14px; color: var(--muted); }

/* win */
.win-target { color: var(--muted); font-size: 14px; }
.stats { display: grid; gap: 8px; margin-bottom: 16px; }
.stats div { display: flex; justify-content: space-between; align-items: center; background: var(--panel-2); padding: 9px 12px; border-radius: 12px; font-size: 15px; }
.stats b { font-family: var(--display); font-weight: 400; font-size: 17px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.stats .total { background: var(--ink); }
.stats .total b { font-size: 26px; color: var(--hazard); }
.stats .coin-ico { width: 18px; height: 18px; }
.stats .coin-ico::after { left: 7.5px; top: 4px; height: 10px; }

/* shop */
.tabs { display: flex; gap: 6px; padding: 10px 12px 0; background: var(--ink); }
.tab { flex: 1; height: 40px; border-radius: 12px 12px 0 0; background: var(--panel-2); color: var(--muted); font-size: 15px; }
.tab.on { background: var(--panel); color: var(--cream); }
.shop-coins { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 18px; }
.srow { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 14px; padding: 8px 10px; margin-bottom: 8px; }
.srow canvas, .srow .uico { width: 52px; height: 52px; border-radius: 12px; background: var(--ink); }
.srow .uico { display: grid; place-items: center; }
.srow .uico svg { width: 30px; height: 30px; fill: var(--hazard); }
.srow .nm { font-family: var(--display); font-size: 15px; }
.srow .nm small { font-family: var(--body); font-size: 11px; color: var(--hazard); margin-left: 4px; }
.srow .ds { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.srow .ds b { color: var(--good); font-weight: 600; }
.srow .btn { height: 44px; font-size: 15px; padding: 0 12px; border-radius: 12px; min-width: 92px; }
.srow .btn .coin-ico { width: 16px; height: 16px; }
.srow .btn .coin-ico::after { left: 6.5px; top: 3px; height: 10px; }
.srow.locked { opacity: .55; }
.srow.locked canvas { filter: brightness(0) opacity(.5); }
.free-coins { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: linear-gradient(90deg, #3b2a6b, var(--panel-2)); padding: 10px 12px; border-radius: 14px; margin-bottom: 12px; }
.free-coins .btn { height: 42px; font-size: 14px; }

/* order (story) */
.client { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; margin-bottom: 14px; }
.avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-style: normal; font-size: 26px; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.15); }
.client b { font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--hazard); }
.client p { position: relative; margin: 6px 0 0; padding: 10px 12px; background: var(--panel-2); border-radius: 4px 14px 14px 14px; font-size: 15px; line-height: 1.4; }
.plan { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--ink); border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
.plan b { color: var(--good); font-family: var(--display); font-weight: 400; font-size: 16px; text-align: right; }
.win-next { text-align: center; margin: -4px 0 12px; font-size: 15px; color: var(--muted); }
.win-next b { color: var(--good); font-family: var(--display); font-weight: 400; }

/* settings */
.set-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 16px; }
.tog { width: 64px; height: 34px; border-radius: 17px; background: #474b57; position: relative; transition: background .15s; }
.tog::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .15s; }
.tog.on { background: var(--good); }
.tog.on::after { left: 34px; }
.reset { margin-top: 16px; width: 100%; background: transparent; color: var(--muted); font-family: var(--body); font-size: 13px; text-decoration: underline; }

/* unlock */
.unlock-ico { width: 150px; height: 150px; margin: 6px auto 4px; display: block; animation: spinIn .8s cubic-bezier(.2,1.5,.4,1); }
@keyframes spinIn { from { transform: scale(0) rotate(-200deg); } }
.unlock-name { font-family: var(--display); font-size: 26px; text-align: center; }
.unlock-desc { text-align: center; color: var(--muted); margin: 4px 0 16px; }
.center { text-align: center; }
.rays { position: absolute; inset: -50%; background: repeating-conic-gradient(rgba(255,200,61,.10) 0 10deg, transparent 10deg 20deg); animation: rays 12s linear infinite; pointer-events: none; }
@keyframes rays { to { transform: rotate(360deg); } }
.unlock-stage { position: relative; overflow: hidden; border-radius: 16px; background: var(--ink); margin-bottom: 12px; }

@media (max-height: 520px) {
  .it { width: 56px; height: 56px; } .it canvas { width: 46px; height: 46px; left: 5px; top: 5px; }
  #btnShop { width: 58px; height: 58px; }
  .top { padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
  #combo { top: calc(58px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .title-wrap .btn, .rays, #hint .finger { animation: none; } }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="top">

      <div id="tName"></div>

    <button class="icon-btn" id="btnSet" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
  <div id="combo"></div>

</div>

<div class="screen" id="title" hidden>

<script>/* ---- core.js ---- */
'use strict';
/* ===== Core: math, polygons, i18n, save ===== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Polygons are flat arrays [x0,y0,x1,y1,...] */
function polyArea(p) {
  let a = 0;
  for (let i = 0, n = p.length; i < n; i += 2) {
    const j = (i + 2) % n;
    a += p[i] * p[j + 1] - p[j] * p[i + 1];
  }
  return a / 2;
}
function polyCentroid(p) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = p.length; i < n; i += 2) {

/* ===== Generative background music: soft plucks per world ===== */
const Music = {
  timer: 0, step: 0, next: 0, world: 0,
  // chord roots (semitones from A2) and modes per world
  prog: [
    [[0, 4, 7], [5, 9, 12], [7, 11, 14], [5, 9, 12]], // village: major, bright
    [[0, 3, 7], [8, 12, 15], [3, 7, 10], [10, 14, 17]], // city: minor lofi
    [[0, 1, 4, 7], [0, 1, 5, 8], [-2, 1, 5, 8], [0, 1, 4, 7]], // desert: phrygian dominant
    [[0, 4, 7, 11], [5, 9, 12, 16], [2, 5, 9, 12], [7, 11, 14, 17]], // ice: maj7 glassy
    [[0, 3, 7, 10], [-4, 0, 3, 7], [-2, 2, 5, 9], [-5, -1, 2, 5]], // space: dreamy minor
  ],
  start() {
    if (this.timer) return;
    this.next = Audio2.ctx.currentTime + 0.2;
    this.timer = setInterval(() => this.tick(), 120);
  },
  tick() {
    const A = Audio2; const c = A.ctx;
    if (!c || !A.music || A.ducked || A.hidden) { if (c) this.next = c.currentTime + 0.1; return; }
    const spb = 0.3; // 8th note
    while (this.next < c.currentTime + 0.4) {
      const prog = this.prog[this.world % this.prog.length];
      const bar = Math.floor(this.step / 8) % prog.length;
      const chord = prog[bar];
      const s = this.step % 8;
      const base = 110;
      const fr = (st) => base * Math.pow(2, st / 12);
      const t = this.next - c.currentTime;
      if (s === 0) this.voice(fr(chord[0] - 12), 2.2, 0.22, 'triangle', t, 600);
      if (s === 4) this.voice(fr(chord[0] - 12 + 7), 1.0, 0.12, 'triangle', t, 600);
      const pattern = [0, 2, 1, 2, 0, 2, 1, 3];
      const idx = pattern[s] % chord.length;
      if (Math.random() < 0.85) this.voice(fr(chord[idx] + 12), 0.45, 0.09, 'triangle', t, 2400);
      if (s === 0 && Math.random() < 0.5) this.voice(fr(chord[(bar + 1) % chord.length] + 24), 1.2, 0.04, 'sine', t + spb * 2, 3000);
      this.step++;
      this.next += spb;
    }
  },
  voice(f, dur, g, type, delay, lp) {
    Audio2.tone({ f, dur, g, type, delay: Math.max(0, delay), lp, out: Audio2.mus, a: 0.01 });
  },
};

'use strict';
/* ===== Worlds & destructible targets =====
   Authoring coords: x centered at 0, y = height above ground (up positive). */
const R_ = (x, y, w, h, m) => ({ pts: [x, y, x + w, y, x + w, y + h, x, y + h], m });
const P_ = (pts, m) => ({ pts: pts.flat(), m });
const C_ = (cx, cy, r, m, n = 22, ry) => {
  const p = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * TAU; p.push(cx + Math.cos(a) * r, cy + Math.sin(a) * (ry || r)); }
  return { pts: p, m };
};
/* half ellipse / dome, flat side down */
const D_ = (cx, cy, rx, ry, m, n = 16) => {
  const p = [cx - rx, cy];
  for (let i = 1; i < n; i++) { const a = Math.PI - (i / n) * Math.PI; p.push(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry); }
  p.push(cx + rx, cy);
  return { pts: p, m };
};
const ROT_ = (cx, cy, w, h, ang, m) => {
  const c = Math.cos(ang), s = Math.sin(ang), p = [];
  for (const [x, y] of [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]) p.push(cx + x * c - y * s, cy + x * s + y * c);
  return { pts: p, m };
};
const TRI_ = (x, y, w, h, m) => P_([[x, y], [x + w, y], [x + w / 2, y + h]], m);
/* wall with rectangular windows: splits into non-overlapping rects */
function WALL_(x, y, w, h, m, wins, wm = 'glass') {
  const xs = new Set([x, x + w]), ys = new Set([y, y + h]);
  for (const [wx, wy, ww, wh] of wins) { xs.add(wx); xs.add(wx + ww); ys.add(wy); ys.add(wy + wh); }
  const X = [...xs].sort((a, b) => a - b), Y = [...ys].sort((a, b) => a - b);
  const out = [];
  const inWin = (px, py) => wins.find(([wx, wy, ww, wh]) => px > wx && px < wx + ww && py > wy && py < wy + wh);
  for (let j = 0; j < Y.length - 1; j++) {
    let run = null;
    for (let i = 0; i < X.length - 1; i++) {
      const cx = (X[i] + X[i + 1]) / 2, cy = (Y[j] + Y[j + 1]) / 2;
      const win = inWin(cx, cy);
      if (win) {
        if (run) { out.push(R_(run, Y[j], X[i] - run, Y[j + 1] - Y[j], m)); run = null; }
        out.push(R_(X[i], Y[j], X[i + 1] - X[i], Y[j + 1] - Y[j], win[4] || wm));
      } else if (run === null) run = X[i];
    }
    if (run !== null) out.push(R_(run, Y[j], X[X.length - 1] - run, Y[j + 1] - Y[j], m));
  }
  return out;
}
const grid = (x0, y0, nx, ny, w, h, gx, gy) => {
  const r = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) r.push([x0 + i * (w + gx), y0 + j * (h + gy), w, h]);
  return r;
};

function targetForLevel(level) {
  const idx = (level - 1) % TARGETS.length;
  const cycle = Math.floor((level - 1) / TARGETS.length);
  const world = Math.floor(idx / 6);
  return { idx, cycle, world, def: TARGETS[idx], boss: !!TARGETS[idx].boss };
}
/* growth curve: steep early so upgrades matter, gentler in the endless tail */
function growth(level) {
  const a = Math.min(level, 40) - 1, b = Math.max(0, level - 40);
  return Math.pow(1.22, a) * Math.pow(1.16, b);
}
function levelHP(level) {
  const t = targetForLevel(level);
  return Math.round(1250 * growth(level) * (t.boss ? 2.1 : 1));
}
function levelReward(level) {
  const t = targetForLevel(level);
  return Math.round(28 * growth(level) * (t.boss ? 2.5 : 1));
}

'use strict';
/* ===== World: destructible structure (Voronoi cells), damage, debris physics ===== */
const G_ITEM = 3000;        // gravity for dropped items
const G_DEBRIS = 2500;      // gravity for debris
const BUCKET = 64;

const World = {
  cells: [], buckets: new Map(), qid: 0,
  totalHP: 0, standingHP: 0, winHP: 0,
  bbox: { x0: 0, y0: 0, x1: 0, y1: 0 },
  debris: [], structDirty: true, checkPending: false,
  grav: 1,

  build(level) {
    const info = targetForLevel(level);
    const parts = info.def.build();
    const R = mulberry32(level * 7919 + 13);
    const cells = [];
    let totalArea = 0;
    for (const part of parts) totalArea += Math.abs(polyArea(part.pts));
    const CS = clamp(Math.sqrt(totalArea / 190), 22, 38);
    this.cellSize = CS;
    for (const part of parts) {
      const pts = [];
      for (let i = 0; i < part.pts.length; i += 2) pts.push(part.pts[i], -part.pts[i + 1]);
      if (polyArea(pts) < 0) { // normalize winding
        const rev = [];
        for (let i = pts.length - 2; i >= 0; i -= 2) rev.push(pts[i], pts[i + 1]);
        pts.length = 0; pts.push(...rev);
      }
      const area = Math.abs(polyArea(pts));
      const n = Math.max(1, Math.round(area / (CS * CS)));
      const bb = polyBBox(pts);
      const seeds = [];
      const minD = CS * 0.62;
      let tries = 0;
      while (seeds.length < n && tries < n * 60) {
        tries++;
        const x = bb.x0 + R() * (bb.x1 - bb.x0), y = bb.y0 + R() * (bb.y1 - bb.y0);
        if (!pointInPoly(pts, x, y)) continue;
        const md = tries < n * 40 ? minD : minD * 0.4;
        let ok = true;
        for (let k = 0; k < seeds.length; k += 2) { const dx = seeds[k] - x, dy = seeds[k + 1] - y; if (dx * dx + dy * dy < md * md) { ok = false; break; } }
        if (ok) seeds.push(x, y);
      }
      if (seeds.length <= 2) { cells.push(this.makeCell(pts, part.m, R)); continue; }
      for (let i = 0; i < seeds.length; i += 2) {
        let poly = pts;
        const sx = seeds[i], sy = seeds[i + 1];
        for (let j = 0; j < seeds.length; j += 2) {
          if (i === j) continue;
          const tx = seeds[j], ty = seeds[j + 1];
          const nx = tx - sx, ny = ty - sy;
          if (nx * nx + ny * ny > CS * CS * 20) continue;
          poly = clipHalf(poly, nx, ny, nx * (sx + tx) / 2 + ny * (sy + ty) / 2);
          if (poly.length < 6) break;
        }
        poly = cleanPoly(poly);
        if (poly.length < 6 || Math.abs(polyArea(poly)) < 6) continue;
        cells.push(this.makeCell(poly, part.m, R));
      }
    }
    // HP normalisation
    let raw = 0;
    for (const c of cells) raw += c.area * MATS[c.mat].hp;
    const hp = levelHP(level);
    const k = hp / raw;
    for (const c of cells) { c.maxHP = c.hp = c.area * MATS[c.mat].hp * k; }
    cells.forEach((c, i) => { c.id = i; });
    this.cells = cells;
    this.totalHP = this.standingHP = hp;
    this.winHP = hp * 0.12;
    this.adjacency();
    this.rebuildBuckets();
    this.debris.length = 0;
    this.structDirty = true;
    const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    for (const c of cells) { b.x0 = Math.min(b.x0, c.bb.x0); b.y0 = Math.min(b.y0, c.bb.y0); b.x1 = Math.max(b.x1, c.bb.x1); b.y1 = Math.max(b.y1, c.bb.y1); }
    this.bbox = b;
    this.grav = WORLDS[info.world].grav;
    // sanity: anything floating at start gets anchored to avoid instant collapse
    const reach = this.reachable();
    for (const c of cells) if (!reach[c.id]) c.anchored = true;
    return info;
  },

  makeCell(pts, mat, R) {
    const cen = polyCentroid(pts);
    const bb = polyBBox(pts);
    let r = 0;
    for (let i = 0; i < pts.length; i += 2) r = Math.max(r, Math.hypot(pts[i] - cen.x, pts[i + 1] - cen.y));
    // crack polylines from an off-centre point toward random vertices
    const cracks = [];
    const ox = cen.x + (R() - 0.5) * r * 0.5, oy = cen.y + (R() - 0.5) * r * 0.5;
    const nb = 2 + Math.floor(R() * 2);
    const nv = pts.length / 2;
    for (let b = 0; b < nb; b++) {
      const vi = Math.floor(R() * nv) * 2;
      const tx = pts[vi] * 0.85 + cen.x * 0.15, ty = pts[vi + 1] * 0.85 + cen.y * 0.15;
      const line = [ox, oy];
      const steps = 3;
      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        const j = s === steps ? 0 : (R() - 0.5) * r * 0.35;
        line.push(lerp(ox, tx, t) + j, lerp(oy, ty, t) + j * 0.7);
      }
      cracks.push(line);
    }
    return {
      id: 0, pts, cx: cen.x, cy: cen.y, area: cen.a, r, bb, mat, hp: 1, maxHP: 1, alive: true,
      nb: [], anchored: bb.y1 >= -2.5, cracks, frozen: 0, acid: 0, flash: 0, _q: 0,
    };
  },

  adjacency() {
    const cs = this.cells;
    const eps = 3;
    const near = (a, b) => { // count vertices of a lying on/inside b
      let n = 0;
      const p = a.pts, q = b.pts;
      for (let i = 0; i < p.length; i += 2) {
        const x = p[i], y = p[i + 1];
        if (x < b.bb.x0 - eps || x > b.bb.x1 + eps || y < b.bb.y0 - eps || y > b.bb.y1 + eps) continue;
        if (pointInPoly(q, x, y)) { n++; continue; }
        const cp = closestOnPoly(q, x, y);
        if (cp.d2 < eps * eps) n++;
      }
      return n;
    };
    for (let i = 0; i < cs.length; i++) {
      const a = cs[i];
      for (let j = i + 1; j < cs.length; j++) {
        const b = cs[j];
        if (a.bb.x1 + eps < b.bb.x0 || b.bb.x1 + eps < a.bb.x0 || a.bb.y1 + eps < b.bb.y0 || b.bb.y1 + eps < a.bb.y0) continue;
        if (near(a, b) + near(b, a) >= 2) { a.nb.push(j); b.nb.push(i); }
      }
    }
  },

  rebuildBuckets() {
    this.buckets.clear();
    for (const c of this.cells) {
      if (!c.alive) continue;
      const ix0 = Math.floor(c.bb.x0 / BUCKET), ix1 = Math.floor(c.bb.x1 / BUCKET);
      const iy0 = Math.floor(c.bb.y0 / BUCKET), iy1 = Math.floor(c.bb.y1 / BUCKET);
      for (let ix = ix0; ix <= ix1; ix++) for (let iy = iy0; iy <= iy1; iy++) {
        const k = (ix + 512) * 4096 + (iy + 2048);
        let arr = this.buckets.get(k);
        if (!arr) { arr = []; this.buckets.set(k, arr); }
        arr.push(c);
      }
    }
  },

  /* iterate alive cells whose bucket overlaps the box */
  query(x0, y0, x1, y1, fn) {
    const q = ++this.qid;
    const ix0 = Math.floor(x0 / BUCKET), ix1 = Math.floor(x1 / BUCKET);
    const iy0 = Math.floor(y0 / BUCKET), iy1 = Math.floor(y1 / BUCKET);
    for (let ix = ix0; ix <= ix1; ix++) for (let iy = iy0; iy <= iy1; iy++) {
      const arr = this.buckets.get((ix + 512) * 4096 + (iy + 2048));
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {
        const c = arr[i];
        if (!c.alive || c._q === q) continue;
        c._q = q;
        if (c.bb.x1 < x0 || c.bb.x0 > x1 || c.bb.y1 < y0 || c.bb.y0 > y1) continue;
        if (fn(c) === false) return;
      }
    }
  },

  /* deepest contact between a circle and standing cells */
  circleContact(x, y, r) {
    let best = null, bestDepth = 0;
    this.query(x - r, y - r, x + r, y + r, (c) => {
      const inside = pointInPoly(c.pts, x, y);
      const cp = closestOnPoly(c.pts, x, y);
      const d = Math.sqrt(cp.d2);
      if (!inside && d >= r) return;
      let nx, ny, depth;
      if (d < 1e-4) { nx = 0; ny = -1; depth = r; }
      else if (inside) { nx = (cp.x - x) / d; ny = (cp.y - y) / d; depth = r + d; }
      else { nx = (x - cp.x) / d; ny = (y - cp.y) / d; depth = r - d; }
      if (depth > bestDepth) { bestDepth = depth; best = { c, nx, ny, depth, px: cp.x, py: cp.y }; }
    });
    return best;
  },

  reachable() {
    const seen = new Uint8Array(this.cells.length);
    const stack = [];
    for (const c of this.cells) if (c.alive && c.anchored) { seen[c.id] = 1; stack.push(c.id); }
    while (stack.length) {
      const id = stack.pop();
      const nb = this.cells[id].nb;
      for (let i = 0; i < nb.length; i++) {
        const j = nb[i];
        if (!seen[j] && this.cells[j].alive) { seen[j] = 1; stack.push(j); }
      }
    }
    return seen;
  },

  /* detach everything no longer connected to the ground; returns detached cells */
  structuralCheck() {
    this.checkPending = false;
    const seen = this.reachable();
    const out = [];
    for (const c of this.cells) {
      if (c.alive && !seen[c.id]) { c.alive = false; this.standingHP -= c.hp; out.push(c); }
    }
    if (out.length) { this.structDirty = true; this.rebuildBuckets(); }
    return out;
  },

  killCell(c) {
    c.alive = false;
    this.structDirty = true;
    this.checkPending = true;
    this._bucketsDirty = true;
  },

  /* ===== debris rigid bodies ===== */
  addDebris(wp, mat, vx, vy, av, ref) {
    if (wp.length < 6) return null;
    const cen = polyCentroid(wp);
    if (cen.a < 8) return null;
    const m = MATS[mat];
    const mass = (cen.a * m.dens) / 1000;
    const Iu = polyInertia(wp, cen.x, cen.y);
    let r = 0;
    for (let i = 0; i < wp.length; i += 2) r = Math.max(r, Math.hypot(wp[i] - cen.x, wp[i + 1] - cen.y));
    let x = cen.x, y = cen.y, a = 0;
    if (ref) { // piece of an already moving body: map reference-frame centroid to world
      const c = Math.cos(ref.a), s = Math.sin(ref.a);
      const lx = cen.x - ref.ox, ly = cen.y - ref.oy;
      x = ref.x + lx * c - ly * s; y = ref.y + lx * s + ly * c; a = ref.a;
    }
    const d = {
      wp, ox: cen.x, oy: cen.y, x, y, a, vx, vy, av, m: mass, I: Math.max(mass * Iu, 0.01),
      r, cr: Math.sqrt(cen.a / Math.PI) * 0.92, area: cen.a, mat, sleep: false, still: 0, life: 0, alpha: 1,
      dmg: 0, shrink: 1, landed: false,
    };
    this.debris.push(d);
    return d;
  },

  splitDebris(d) {
    const ang = rand(TAU);
    const [A, B] = splitPoly(d.wp, d.ox, d.oy, ang);
    const out = [];
    for (const P of [A, B]) {
      if (P.length < 6) continue;
      const cen = polyCentroid(P);
      const c = Math.cos(d.a), s = Math.sin(d.a);
      const rx = (cen.x - d.ox) * c - (cen.y - d.oy) * s, ry = (cen.x - d.ox) * s + (cen.y - d.oy) * c;
      const vx = d.vx - d.av * ry + rx * rand(1, 4), vy = d.vy + d.av * rx - rand(40, 160);
      const nd = this.addDebris(P, d.mat, vx, vy, d.av + rand(-4, 4), d);
      if (nd) { nd.dmg = d.dmg; nd.life = d.life; out.push(nd); }
    }
    d.dead = true;
    return out;
  },

  stepDebris(dt, onLand) {
    const g = G_DEBRIS * this.grav;
    const list = this.debris;
    for (let k = 0; k < list.length; k++) {
      const d = list[k];
      if (d.dead) continue;
      d.life += dt;
      if (d.sleep) { d.still += dt; continue; }
      d.vy += g * dt;
      d.vx *= 0.9995; d.av *= 0.996;
      d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.av * dt;
      // ground contact
      if (d.y + d.r > 0) {
        const c = Math.cos(d.a), s = Math.sin(d.a);
        let deep = 0, rx = 0, ry = 0, cnt = 0, sx = 0;
        const wp = d.wp;
        for (let i = 0; i < wp.length; i += 2) {
          const lx = (wp[i] - d.ox) * d.shrink, ly = (wp[i + 1] - d.oy) * d.shrink;
          const wx = lx * c - ly * s, wy = lx * s + ly * c;
          const pen = d.y + wy;
          if (pen > 0) { cnt++; sx += wx; if (pen > deep) { deep = pen; rx = wx; ry = wy; } }
        }
        if (cnt) {
          if (cnt > 1) rx = (rx + sx / cnt) / 2; // blend toward contact centre for stability
          d.y -= deep;
          const vcx = d.vx - d.av * ry, vcy = d.vy + d.av * rx;
          if (vcy > 0) {
            const impact = vcy;
            const e = impact > 300 ? 0.18 : 0.02;
            const rn = -rx;
            const j = ((1 + e) * vcy) / (1 / d.m + (rn * rn) / d.I);
            d.vy -= j / d.m;
            d.av += (rn * j) / d.I;
            const vt = d.vx - d.av * ry;
            const rt = -ry;
            let jt = -vt / (1 / d.m + (rt * rt) / d.I);
            const mu = 0.55 * j;
            jt = clamp(jt, -mu, mu);
            d.vx += jt / d.m;
            d.av += (rt * jt) / d.I;
            if (impact > 250 && onLand) onLand(d, impact);
            d.landed = true;
          }
          d.av *= 0.97; d.vx *= 0.985;
        }
        const sp = d.vx * d.vx + d.vy * d.vy;
        if (sp < 400 && Math.abs(d.av) < 0.6 && cnt) { d.still += dt; if (d.still > 0.35) { d.sleep = true; d.vx = d.vy = d.av = 0; } }
        else d.still = 0;
      }
    }
  },

  /* cheap circle-based debris vs debris separation (gives piles) */
  collideDebris() {
    const list = this.debris;
    const H = new Map();
    const S = 70;
    for (let i = 0; i < list.length; i++) {
      const d = list[i];
      if (d.dead || d.alpha < 0.6) continue;
      const k = (Math.floor(d.x / S) + 512) * 4096 + Math.floor(d.y / S) + 2048;
      let a = H.get(k); if (!a) { a = []; H.set(k, a); } a.push(d);
    }
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (a.dead || a.sleep || a.alpha < 0.6) continue;
      const bx = Math.floor(a.x / S), by = Math.floor(a.y / S);
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const arr = H.get((bx + ox + 512) * 4096 + by + oy + 2048);
        if (!arr) continue;
        for (let j = 0; j < arr.length; j++) {
          const b = arr[j];
          if (b === a || (!b.sleep && b._pair === a)) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const rr = (a.cr + b.cr) * 0.8;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr || d2 < 1e-6) continue;
          a._pair = b;
          const dist = Math.sqrt(d2), nx = dx / dist, ny = dy / dist;
          const pen = rr - dist;
          const ima = 1 / a.m, imb = b.sleep ? 0 : 1 / b.m;
          const sum = ima + imb;
          a.x -= nx * pen * (ima / sum) * 0.6; a.y -= ny * pen * (ima / sum) * 0.6;
          if (!b.sleep) { b.x += nx * pen * (imb / sum) * 0.6; b.y += ny * pen * (imb / sum) * 0.6; }
          const rv = (b.sleep ? 0 : b.vx - a.vx) * nx + ((b.sleep ? 0 : b.vy) - a.vy) * ny;
          const rvx = (b.sleep ? 0 : b.vx) - a.vx, rvy = (b.sleep ? 0 : b.vy) - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const jn = (-1.1 * vn) / sum;
            a.vx -= jn * nx * ima; a.vy -= jn * ny * ima;
            if (!b.sleep) { b.vx += jn * nx * imb; b.vy += jn * ny * imb; }
            a.av *= 0.96;
            if (b.sleep && Math.abs(rv) > 500) b.sleep = false;
          }
          if (b.sleep && a.vy * a.vy + a.vx * a.vx < 900) { a.still += 0.02; if (a.still > 0.5) { a.sleep = true; a.vx = a.vy = a.av = 0; } }
        }
      }
    }
  },
};

'use strict';
/* ===== Particles, floating texts, flying coins ===== */
const SOFT = new Map();
function softSprite(col) {
  let c = SOFT.get(col);
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = col; g.fillRect(0, 0, 64, 64);
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.35, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  SOFT.set(col, c);
  return c;
}

/* particle types */
const PT = { CHIP: 0, DUST: 1, SPARK: 2, SMOKE: 3, FIRE: 4, SHARD: 5, RING: 6, DROP: 7, FLASH: 8, SNOW: 9, KEY: 10 };
const FX = {
  list: [], texts: [], coins: [], max: 1400,
  add(o) {
    if (this.list.length >= this.max) { this.list.shift(); }
    o.t = 0; o.a = o.a || 0; o.av = o.av || 0; o.g = o.g === undefined ? 1 : o.g;
    this.list.push(o);
    return o;
  },
  chips(x, y, mat, n, power, dirx = 0, diry = -1) {
    const m = MATS[mat];
    const type = m.chip === 'shard' ? PT.SHARD : m.chip === 'spark' ? PT.SPARK : m.chip === 'snow' ? PT.SNOW : PT.CHIP;
    for (let i = 0; i < n; i++) {
      const sp = rand(150, 600) * power;
      const a = Math.atan2(diry, dirx) + rand(-1.3, 1.3);
      this.add({
        type, x: x + rand(-6, 6), y: y + rand(-6, 6), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(50, 250),
        life: rand(0.5, 1.3), size: type === PT.SPARK ? rand(2, 4) : rand(3, 9) * (m.chip === 'splinter' ? 1.2 : 1),
        col: pick(m.cols), a: rand(TAU), av: rand(-14, 14), long: m.chip === 'splinter', alpha: m.alpha || 1,
      });
      if (type === PT.SPARK && Math.random() < 0.4) this.add({ type: PT.CHIP, x, y, vx: Math.cos(a) * sp * 0.6, vy: Math.sin(a) * sp * 0.6, life: rand(0.5, 1), size: rand(2, 5), col: m.cols[1], a: rand(TAU), av: rand(-10, 10) });
    }
  },
  dust(x, y, col, n, size, spread = 30, up = 40) {
    for (let i = 0; i < n; i++) {
      this.add({ type: PT.DUST, x: x + rand(-spread, spread), y: y + rand(-spread * 0.5, spread * 0.5), vx: rand(-90, 90), vy: rand(-up, up * 0.3) - 20, life: rand(0.8, 1.8), size: size * rand(0.7, 1.4), col, g: 0, alpha: rand(0.35, 0.6) });
    }
  },
  smoke(x, y, n, size, col = '#3b3a3a') {
    for (let i = 0; i < n; i++) this.add({ type: PT.SMOKE, x: x + rand(-20, 20), y: y + rand(-20, 20), vx: rand(-60, 60), vy: rand(-140, -40), life: rand(1.4, 2.6), size: size * rand(0.7, 1.3), col, g: 0, alpha: rand(0.35, 0.6) });
  },
  fire(x, y, n, size, spd = 500) {
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), sp = rand(0.2, 1) * spd;
      this.add({ type: PT.FIRE, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: rand(0.3, 0.8), size: size * rand(0.6, 1.3), col: pick(['#ffd35a', '#ff8a2a', '#ff5a1f', '#fff1b0']), g: -0.1 });
    }
  },
  sparks(x, y, n, spd = 700, col) {
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), sp = rand(0.3, 1) * spd;
      this.add({ type: PT.SPARK, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, life: rand(0.3, 0.9), size: rand(2, 4), col: col || pick(['#fff3b0', '#ffd35a', '#ffb02a']) });
    }
  },
  ring(x, y, r, col = 'rgba(255,255,255,0.9)', life = 0.45, w = 10) { this.add({ type: PT.RING, x, y, vx: 0, vy: 0, life, size: r, col, g: 0, w }); },
  flash(x, y, r, col = '#fff6d8', life = 0.18) { this.add({ type: PT.FLASH, x, y, vx: 0, vy: 0, life, size: r, col, g: 0 }); },

  text(x, y, s, col = '#fff', size = 30, life = 0.9) {
    if (this.texts.length > 40) this.texts.shift();
    this.texts.push({ x: x + rand(-10, 10), y, s, col, size, t: 0, life, vy: -120 });
  },

  update(dt, grav) {
    const L = this.list;
    let w = 0;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      p.t += dt;
      if (p.t >= p.life) continue;
      switch (p.type) {
        case PT.DUST: case PT.SMOKE: p.vx *= 0.96; p.vy *= 0.96; p.vy -= (p.type === PT.SMOKE ? 30 : 10) * dt; break;
        case PT.FIRE: p.vx *= 0.92; p.vy *= 0.92; p.vy -= 200 * dt; break;
        case PT.SNOW: p.vy += 900 * grav * dt; p.vx *= 0.97; break;
        default: p.vy += 1800 * grav * p.g * dt;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.av * dt;
      if ((p.type === PT.CHIP || p.type === PT.SHARD || p.type === PT.SNOW || p.type === PT.KEY || p.type === PT.DROP) && p.y > -p.size * 0.3) {
        p.y = -p.size * 0.3;
        if (p.vy > 60) { p.vy *= -0.3; p.vx *= 0.6; p.av *= 0.5; } else { p.vy = 0; p.vx *= 0.85; p.av *= 0.8; }
      }
      if (p.type === PT.SPARK && p.y > 0) { p.y = 0; p.vy *= -0.4; }
      L[w++] = p;
    }
    L.length = w;
    for (const t of this.texts) { t.t += dt; t.y += t.vy * dt; t.vy *= 0.92; }
    this.texts = this.texts.filter((t) => t.t < t.life);
  },

  draw(g, s) {
    const L = this.list;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      const k = p.t / p.life;
      switch (p.type) {
        case PT.CHIP: case PT.SHARD: case PT.SNOW: case PT.KEY: {
          g.globalAlpha = (k > 0.7 ? (1 - k) / 0.3 : 1) * (p.alpha || 1);
          g.fillStyle = p.col;
          g.save(); g.translate(p.x, p.y); g.rotate(p.a);
          const z = p.size;
          if (p.type === PT.SHARD) { g.beginPath(); g.moveTo(-z, -z * 0.4); g.lineTo(z, -z * 0.2); g.lineTo(-z * 0.2, z * 0.7); g.closePath(); g.fill(); g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(-z * 0.6, -z * 0.3, z, 1); }
          else if (p.type === PT.SNOW) { g.beginPath(); g.arc(0, 0, z * 0.6, 0, TAU); g.fill(); }
          else if (p.type === PT.KEY) { g.fillRect(-z * 0.3, -z, z * 0.6, z * 2); }
          else if (p.long) g.fillRect(-z, -z * 0.22, z * 2, z * 0.44);
          else { g.beginPath(); g.moveTo(-z * 0.6, -z * 0.5); g.lineTo(z * 0.5, -z * 0.6); g.lineTo(z * 0.6, z * 0.4); g.lineTo(-z * 0.3, z * 0.6); g.closePath(); g.fill(); }
          g.restore();
          break;
        }
        case PT.DUST: case PT.SMOKE: {
          const sz = p.size * (1 + k * (p.type === PT.SMOKE ? 2.2 : 1.6));
          g.globalAlpha = p.alpha * (1 - k) * (k < 0.1 ? k / 0.1 : 1);
          g.drawImage(softSprite(p.col), p.x - sz, p.y - sz, sz * 2, sz * 2);
          break;
        }
        case PT.FIRE: {
          const sz = p.size * (1 - k * 0.7);
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = 1 - k;
          g.drawImage(softSprite(p.col), p.x - sz, p.y - sz, sz * 2, sz * 2);
          g.globalCompositeOperation = 'source-over';
          break;
        }
        case PT.SPARK: {
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = 1 - k;
          g.strokeStyle = p.col; g.lineWidth = p.size;
          g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); g.stroke();
          g.globalCompositeOperation = 'source-over';
          break;
        }
        case PT.RING: {
          const r = p.size * easeOutCubic(k);
          g.globalAlpha = (1 - k) * 0.9;
          g.strokeStyle = p.col; g.lineWidth = p.w * (1 - k) + 1;
          g.beginPath(); g.arc(p.x, p.y, r, 0, TAU); g.stroke();
          break;
        }
        case PT.FLASH: {
          const sz = p.size * (0.6 + k * 0.6);
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = 1 - k;
          g.drawImage(softSprite(p.col), p.x - sz, p.y - sz, sz * 2, sz * 2);
          g.globalCompositeOperation = 'source-over';
          break;
        }
        case PT.DROP: {
          g.globalAlpha = 1 - k; g.fillStyle = p.col;
          g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill();
          break;
        }
      }
    }
    g.globalAlpha = 1;
    // floating texts
    for (const t of this.texts) {
      const k = t.t / t.life;
      const pop = k < 0.15 ? easeOutBack(k / 0.15) : 1;
      const sz = (t.size * pop) / s;
      g.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      g.font = `${Math.round(sz)}px "Russo One", "Arial Black", Impact, sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = sz * 0.16; g.strokeStyle = 'rgba(20,14,8,.85)'; g.lineJoin = 'round';
      g.strokeText(t.s, t.x, t.y);
      g.fillStyle = t.col; g.fillText(t.s, t.x, t.y);
    }
    g.globalAlpha = 1;
  },
};
